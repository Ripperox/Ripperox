<svg width="1000" height="240" viewBox="0 0 1000 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- panel -->
  <rect x="1" y="1" width="998" height="238" rx="10" fill="#09090b" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <!-- title bar -->
  <rect x="1" y="1" width="998" height="34" rx="10" fill="#0f0f11"/>
  <rect x="1" y="25" width="998" height="10" fill="#0f0f11"/>
  <line x1="1" y1="35.5" x2="999" y2="35.5" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="22" cy="18" r="5" fill="#ef4444" opacity="0.85"/>
  <circle cx="40" cy="18" r="5" fill="#d8b14a" opacity="0.85"/>
  <circle cx="58" cy="18" r="5" fill="#0ac2a6" opacity="0.85"/>
  <text x="500" y="22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#8a8a90">rishit@github: ~</text>

  <!-- prompt -->
  <text x="36" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#8a8a90">
    <tspan fill="#00ff9d">$</tspan> whoami
  </text>

  <!-- name -->
  <text x="34" y="122" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="40" font-weight="700" letter-spacing="2" fill="#ededf0">RISHIT DHOTE</text>

  <!-- role -->
  <text x="36" y="156" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#00ff9d">backend &amp; distributed systems engineer</text>

  <!-- detail line -->
  <text x="36" y="186" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#8a8a90">rust · typescript · realtime systems — currently shipping trading infra @ apeing labs</text>

  <!-- metrics, right aligned -->
  <text x="964" y="72" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#5a5a60">1000+ concurrent users / replica</text>
  <text x="964" y="94" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#5a5a60">sub-second realtime fanout</text>
  <text x="964" y="116" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#5a5a60">89% &#8594; 99% delivery @ 1k users</text>

  <!-- prompt line 2 with blinking cursor -->
  <text x="36" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#8a8a90"><tspan fill="#00ff9d">$</tspan> </text>
  <rect x="56" y="204" width="9" height="16" fill="#00ff9d">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.4s" repeatCount="indefinite"/>
  </rect>
</svg>
